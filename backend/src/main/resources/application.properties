spring.application.name=BusGo

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/busgo?currentSchema=busgo_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:monesh@1511}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=busgo_demo
busgo.admin.bootstrap.enabled=${BUSGO_ADMIN_BOOTSTRAP_ENABLED:false}
busgo.admin.bootstrap.email=${BUSGO_ADMIN_EMAIL:}
busgo.admin.bootstrap.name=${BUSGO_ADMIN_NAME:BusGo Admin}
busgo.admin.bootstrap.phone=${BUSGO_ADMIN_PHONE:}
busgo.admin.bootstrap.password=${BUSGO_ADMIN_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}

spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss
